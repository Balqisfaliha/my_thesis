trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerfilePath: '**/Dockerfile'
  imageRepository: 'web-app'
  acrServiceConnection: 'balqis-acr-connection'  # ACR SERVICE CONN NAME (renamed for clarity)
  acrLoginServer: 'balqisacr.azurecr.io'  # FULL ACR URL for deploy path
  imageTag: 'latest'
  buildIdTag: '$(Build.BuildId)'
  azureSubscription: 'Azure-service-connection'
  appName: 'my-web-apps'

steps:
- checkout: self

- task: Docker@2
  displayName: 'Login to ACR'
  inputs:
    containerRegistry: 'balqis-acr-connection'
    command: 'login'

- task: Docker@2
  displayName: 'Build Image'
  inputs:
    containerRegistry: 'balqis-acr-connection'
    command: 'build'
    Dockerfile: '**/Dockerfile'
    buildContext: '.'
    tags: |
      $(imageTag)
      $(buildIdTag)

- task: Docker@2
  displayName: 'Push Image'
  inputs:
    containerRegistry: 'balqis-acr-connection'
    repository: '$(imageRepository)'
    command: 'push'
    tags: |
      $(imageTag)
      $(buildIdTag)

- task: AzureWebAppContainer@1
  displayName: 'Deploy to Web App'
  inputs:
    azureSubscription: 'Azure subscription 1(9924aee3-25d0-46bf-90d2-583398c03d3e)'
    appName: 'my-web-apps'
    containers: '$(acrLoginServer)/$(imageRepository):$(imageTag)'
