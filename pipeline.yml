trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Log in to Azure Container Registry \
- task: Docker@2
  displayName: 'Log in to ACR'
  inputs:
    command: 'login'
    containerRegistry: 'your-acr-service-connection'  # Ganti dengan nama service connection ACR Anda

# Step 2: Build Docker Image 
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    command: 'build'
    dockerfile: '**/Dockerfile'
    buildContext: '.'
    tags: |
      latest
      
# Step 4: Deploy to Azure Web App 
- task: AzureWebAppContainer@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: 'Azure-service-connection' # Ganti dengan nama service connection Azure Anda
    appName: 'my-web-apps' # Ganti dengan nama Web App Anda
    containers: 'balqisacr.azurecr.io/web-app:latest' # Ganti dengan alamat image lengkap di ACR Anda
    # The 'containerRegistry' input for this task is NOT needed if you use the full address in 'containers'


# ==============================================
# PIPELINE TRIGGER
# ==============================================
trigger:
  branches:
    include:
      - main  # The pipeline will run automatically on any push to the 'main' branch

# ==============================================
# AGENT SELECTION
# ==============================================
pool:
  vmImage: 'ubuntu-latest'  # Uses a clean, Microsoft-hosted Ubuntu virtual machine to run the pipeline

# ==============================================
# VARIABLES
# ==============================================
variables:
  
  # Path to the Dockerfile in your repository
  dockerfilePath: '**/Dockerfile'
  
  # The name you want for your Docker image
  imageRepository: 'my-web-app'
  
  # The full address of your Azure Container Registry (ACR)
  containerRegistry: 'balqisacr.azurecr.io'
  
  # Tags the image with both 'latest' and the unique build ID
  imageTag: 'latest'
  buildIdTag: 
    # Tells the task where to find the Dockerfile
    dockerfile: Dockerfile