trigger:
  branches:
    include:
      - main  # Trigger on push to the main branch

pool:
  vmImage: 'ubuntu-latest'  # Using the latest Ubuntu image for the build

steps:
# Step 1: Log in to Azure Container Registry (ACR)
- task: Docker@2
  displayName: 'Log in to Azure Container Registry'
  inputs:
    command: 'login'
    containerRegistry: 'balqisacr.azurecr.io'  # Replace with your ACR service connection

# Step 2: Build Docker Image
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    command: 'build'
    dockerfile: 'dockerfile'  # Dockerfile is in the root of project  
    tags: 'latest'
    repository: 'balqisacr.azurecr.io/web-app'  # Your ACR URL and image name

# Step 3: Push Docker Image to Azure Container Registry (ACR)
- task: Docker@2
  displayName: 'Push Docker Image to ACR'
  inputs:
    command: 'push'
    repository: 'balqisacr.azurecr.io/web-app'  # Your ACR URL and image name
    tags: 'latest'

# Step 4: Deploy Docker Image to Azure Web App
- task: AzureWebAppContainer@1
  displayName: 'Deploy Docker image to Azure Web App'
  inputs:
    azureSubscription: 'MyAzureServiceConnection'  # Azure Service Connection name
    appName: 'my-web-apps'  # Replace with your Azure Web App name
    containerRegistry: 'balqisacr.azurecr.io'  # ACR service connection
    imageName: 'balqisacr.azurecr.io/web-app:latest'  # Your ACR image name with tag
    tag: 'latest'