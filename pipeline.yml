trigger:
  branches:
    include:
      - main  # Trigger pipeline on push to the main branch

pool:
  vmImage: 'ubuntu-latest'  # Use Ubuntu for the build process

steps:
  # 1. Checkout the latest code from Azure Repos
  - task: Checkout@1
    inputs:
      clean: true  # Clean the repository before building

  # 2. Build the Docker image
  - script: |
      echo "Building the Docker image for the front-end app"
      docker build -t web-app .  # Builds the Docker image
    displayName: 'Build Docker Image'

  # 3. Push the Docker image to Azure Container Registry (ACR)
  - script: |
      echo "Pushing the Docker image to the container registry"
      docker tag web-app balqisacr.azurecr.io/web-app:latest  # Tag the image with your ACR URL
      docker push balqisacr.azurecr.io/web-app:latest  # Push the image to ACR
    displayName: 'Push Docker Image to ACR'

  # 4. Deploy the Docker image to Azure Web App
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'MyAzureConnection'  # Your Azure Service Connection
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Deploying the Docker image to Azure Web App"
        az webapp config container set --name my-web-app --resource-group my-resource-group --docker-custom-image-name balqisacr.azurecr.io/web-app:latest
    displayName: 'Deploy to Azure Web App'
